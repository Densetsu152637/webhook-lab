name: Scheduled dependency audit
on:
  schedule:
    - cron: '27 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned Rust toolchain
        shell: python
        run: |
          import subprocess, tomllib
          with open('rust-toolchain.toml', 'rb') as source:
              toolchain = tomllib.load(source)['toolchain']
          subprocess.run(['rustup', 'toolchain', 'install', toolchain['channel'], '--profile', 'minimal', '--component', 'rustfmt', '--component', 'clippy'], check=True)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-deny*
            ~/.cargo/bin/cargo-audit*
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: auditors-${{ runner.os }}-deny0.20.2-audit0.22.2-${{ hashFiles('rust-toolchain.toml') }}
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo install --locked cargo-audit --version 0.22.2
      - run: python scripts/check.py audit
